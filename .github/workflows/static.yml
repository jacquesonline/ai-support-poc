# Retained temporarily so GitHub's workflow history remains available.
# It has no Pages deployment capability; pages.yml is the sole publisher.
name: Retired direct Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow is retired. Use Publish static presentation to GitHub Pages."
