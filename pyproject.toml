[project]
name = "ai-support-poc"
version = "0.5.0"
description = "Synthetic legal-technology support desk, Harvey enablement and governed AI improvement demonstration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "openai>=1.54,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uvicorn]
reload = true
no-watch-dir = [".venv"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.setuptools]
packages = ["app"]
